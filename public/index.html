<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div class="container">
        <header>
            <h1>Painel de Alunos</h1>
            <p>Demostrção de CRUD Frontend/Backend (Node.js)</p>
            <button onclick="window.print()" style="margin-top: 1rem; padding:
            10px 20px; font-weight: bold; cursor: pointer; border-radius: 8px;
            border: none; background: white; color: var(--primary-color);">⬇️
                Baixar PDF</button>
        </header>

        <main>
            <section class="from-section">
                <h2>Novo Aluno</h2>
                <form id="aluno-form">
                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" required placeholder="Ex: João da Silva">
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="Ex: joao@email.com">
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="Ex: 123.456.789-00">
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" required placeholder="Ex: (61) 99999-9999">
                    </div>
                    <div class="input-group">
                        <label for="curso">Curso</label>
                        <select id="curso" required>
                            <option value="">Selecione um curso...</option>
                            <option value="Análise de Sistemas">Análise de Sistemas</option>
                            <option value="Engenharia de Software">Engenharia de Software</option>
                            <option value="Ciência da computação">Ciência da computação</option>
                        </select>
                    </div>
                    <div class="from-section">
                        <button type="button" class="btn-cancel" id="btn-cancel" style="display: none;">
                            Cancelar Edição
                        </button>
                        <button type="submit" class="btn-save" id="btn-save">Salvar Aluno</button>
                    </div>
                </form>
            </section>
            <section class="list-section">
                <h2>Alunos Cadastrados</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Curso</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="alunos-tbody">
                            <!-- Aluno serão
                             injetados aqui via
                              JavaScript-->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
